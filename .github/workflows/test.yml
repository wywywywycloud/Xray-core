name: Observatory snapshot validation
on:
  push:
    branches: [ci/observatory-snapshots-check]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Race detector
        run: go test -race ./app/observatory/... -count=10
      - name: Balancer regression tests
        run: go test -race ./app/router/... -run 'Test.*(Balanc|Least|Round|Override|Select)'
      - name: Vet
        run: go vet ./app/observatory/...
      - name: Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
